name: n8n
description: Workflow automation tool
source: https://github.com/n8n-io/n8n
port: 5678

env_vars:
  - key: N8N_BASIC_AUTH_USER
    label: Admin username
    required: true
    secret: false
  - key: N8N_BASIC_AUTH_PASSWORD
    label: Admin password
    required: true
    secret: true

resources:
  min_ram: 1GB
  min_cpu: 1
